<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Thusang Community Safety Platform</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --danger: #dc2626;
            --success: #059669;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --dark: #0f172a;
            --light: #ffffff;
            --accent: #dbeafe;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --radius: 0.75rem;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        .thank-you-container {
            max-width: 500px;
            width: 100%;
            background: var(--light);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2.5rem;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .thank-you-container::before {
            content: '';
            position: absolute;
            top: -60px;
            left: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.15), transparent);
            z-index: -1;
            opacity: 0.5;
        }

        .thank-you-container::after {
            content: '';
            position: absolute;
            bottom: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.15), transparent);
            z-index: -1;
            opacity: 0.5;
        }

        .icon-container {
            font-size: 3rem;
            color: var(--success);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .icon-container i {
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 1rem;
        }

        p {
            font-size: 1rem;
            color: var(--gray);
            margin-bottom: 2rem;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 2rem;
            background: var(--primary);
            color: var(--light);
            font-size: 0.9375rem;
            font-weight: 600;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        @media (max-width: 576px) {
            body {
                padding: 1rem;
                background: var(--light);
            }

            .thank-you-container {
                border-radius: 0;
                box-shadow: none;
                padding: 1.75rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            p {
                font-size: 0.875rem;
            }

            .btn-primary {
                padding: 0.75rem 1.5rem;
                font-size: 0.875rem;
            }

            .icon-container {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <div class="icon-container">
            <i class="fas fa-check-circle"></i>
        </div>
        <h2>Thank You for Submitting!</h2>
        <p>Your response has been received successfully.</p>
        <a href="{{ url_for('dashboard') }}" class="btn-primary">
            <i class="fas fa-home"></i> Back to Dashboard
        </a>
    </div>
</body>
</html>
