<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Chat - Thusang</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-light: #e0e7ff;
      --secondary: #10b981;
      --accent: #f59e0b;
      --danger: #ef4444;
      --dark: #111827;
      --light: #ffffff;
      --gray: #6b7280;
      --gray-light: #e5e7eb;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.15);
      --radius-sm: 0.375rem;
      --radius: 0.5rem;
      --radius-lg: 0.75rem;
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
    }

    .dashboard-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 300px;
      background: var(--light);
      padding: 2rem;
      box-shadow: var(--shadow);
      position: fixed;
      height: 100vh;
      transition: var(--transition);
      z-index: 1000;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--gray-light);
    }

    .sidebar-header img {
      width: 48px;
      margin-right: 1rem;
    }

    .sidebar-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.025em;
    }

    .nav-menu {
      list-style: none;
    }

    .nav-item {
      margin-bottom: 0.75rem;
    }

    .nav-link {
      display: flex;
      align-items: center;
      padding: 1rem;
      color: var(--gray);
      text-decoration: none;
      border-radius: var(--radius);
      transition: var(--transition);
    }

    .nav-link i {
      margin-right: 1rem;
      width: 24px;
      text-align: center;
      font-size: 1.25rem;
    }

    .nav-link:hover {
      background: var(--primary-light);
      color: var(--primary-dark);
      transform: translateX(5px);
    }

    .nav-link.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--light);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .main-content {
      flex: 1;
      margin-left: 300px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--light);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .chat-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      flex-grow: 1;
      text-align: center;
    }

    .back-btn {
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      background: var(--light);
      color: var(--primary-dark);
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
      border: none;
      cursor: pointer;
    }

    .back-btn i {
      margin-right: 0.5rem;
    }

    .back-btn:hover {
      background: var(--primary-light);
      transform: translateX(-3px);
    }

    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      background-color: #f9fafb;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 75%;
      padding: 1rem 1.25rem;
      border-radius: var(--radius-lg);
      position: relative;
      word-wrap: break-word;
      box-shadow: var(--shadow-sm);
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.other {
      background-color: var(--light);
      align-self: flex-start;
      border-bottom-left-radius: var(--radius-sm);
      border: 1px solid var(--gray-light);
    }

    .message.user {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--light);
      align-self: flex-end;
      border-bottom-right-radius: var(--radius-sm);
    }

    .message .sender {
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
    }

    .message.user .sender {
      color: rgba(255, 255, 255, 0.9);
    }

    .message.other .sender {
      color: var(--gray);
    }

    .message .time {
      font-size: 0.6875rem;
      color: rgba(255, 255, 255, 0.7);
      text-align: right;
      margin-top: 0.5rem;
    }

    .message.other .time {
      color: var(--gray);
    }

    .chat-input-container {
      padding: 1.25rem;
      background-color: var(--light);
      border-top: 1px solid var(--gray-light);
      display: flex;
      gap: 1rem;
    }

    #chat-input {
      flex: 1;
      padding: 0.875rem 1.5rem;
      border: 1px solid var(--gray-light);
      border-radius: 2rem;
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
      background-color: #f9fafb;
    }

    #chat-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    #send-button {
      padding: 0.875rem 1.75rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--light);
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #send-button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    #send-button i {
      font-size: 1rem;
    }

    .welcome-message {
      text-align: center;
      color: var(--gray);
      margin: 1.5rem auto;
      font-size: 0.875rem;
      padding: 1.25rem;
      background-color: var(--light);
      border-radius: var(--radius);
      border: 1px solid var(--gray-light);
      max-width: 90%;
      align-self: center;
      box-shadow: var(--shadow-sm);
    }

    .timestamp {
      font-size: 0.75rem;
      color: var(--gray);
      text-align: center;
      margin: 1rem 0;
      padding: 0.5rem 1rem;
      background-color: var(--gray-light);
      border-radius: 2rem;
      align-self: center;
    }

    .chat-messages::-webkit-scrollbar {
      width: 8px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: #f3f4f6;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background-color: var(--gray);
      border-radius: 4px;
    }

    .menu-toggle {
      display: none;
      font-size: 1.5rem;
      color: var(--primary);
      cursor: pointer;
      transition: var(--transition);
    }

    .menu-toggle:hover {
      color: var(--primary-dark);
      transform: rotate(90deg);
    }

    @media (max-width: 992px) {
      .sidebar {
        width: 280px;
        transform: translateX(-280px);
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
      }

      .menu-toggle {
        display: block;
      }
    }

    @media (max-width: 768px) {
      .chat-container {
        border-radius: 0;
      }

      .chat-messages {
        padding: 1rem;
      }

      .message {
        max-width: 85%;
      }

      #send-button {
        padding: 0.75rem 1rem;
      }

      #send-button span {
        display: none;
      }

      .chat-header h2 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Thusang Logo" class="logo-img">
        <h2>Thusang Safety</h2>
      </div>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="{{ url_for('dashboard') }}" class="nav-link">
            <i class="fas fa-home"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="{{ url_for('report_incident') }}" class="nav-link">
            <i class="fas fa-exclamation-circle"></i>
            <span>Report Incident</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="{{ url_for('crime_map') }}" class="nav-link">
            <i class="fas fa-map-marked-alt"></i>
            <span>Crime Map</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="{{ url_for('rewards') }}" class="nav-link">
            <i class="fas fa-award"></i>
            <span>Rewards</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="{{ url_for('communitychat') }}" class="nav-link active">
            <i class="fas fa-comments"></i>
            <span>Community Chat</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="{{ url_for('profile') }}" class="nav-link">
            <i class="fas fa-user-circle"></i>
            <span>My Profile</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      <div class="chat-container">
        <div class="chat-header">
          <button class="back-btn" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i> Back
          </button>
          <h2>Community Chat</h2>
          <div style="width: 80px;"></div> <!-- Spacer for alignment -->
        </div>
        
        <div class="chat-messages" id="chat-messages">
          <div class="timestamp" id="current-date"></div>
          <div class="welcome-message">
            Welcome to the Thusang Community Chat! Please keep conversations respectful and relevant to community safety.
          </div>
        </div>
        
        <div class="chat-input-container">
          <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off">
          <button id="send-button">
            <i class="fas fa-paper-plane"></i>
            <span>Send</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add SocketIO client library -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Connect to SocketIO server
      const socket = io();
      const chatMessages = document.getElementById('chat-messages');
      const chatInput = document.getElementById('chat-input');
      const sendButton = document.getElementById('send-button');
      
      // Display current date
      const currentDate = new Date();
      document.getElementById('current-date').textContent = currentDate.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      // Get user info from session (you'll need to pass this from Flask)
      const userId = "{{ session.get('user_id', '') }}";
      const username = "{{ session.get('user_email', 'Guest').split('@')[0] }}";

      // Join user room to receive admin messages
      socket.emit('join_user_room', { user_id: userId });
      
      // Load previous messages from the server
      fetch('/api/chat/messages')
        .then(response => response.json())
        .then(messages => {
          messages.forEach(msg => {
            addMessageToChat(msg, msg.user_id === userId);
          });
          // Scroll to bottom after loading messages
          chatMessages.scrollTop = chatMessages.scrollHeight;
        })
        .catch(error => console.error('Error loading messages:', error));

      // Handle sending messages
      function sendMessage() {
        const message = chatInput.value.trim();
        if (message && userId) {
          // Emit the message to the server
          socket.emit('user_send_message', {
            user_id: userId,
            username: username,
            message: message
          });
          
          // Clear input
          chatInput.value = '';
        }
      }

      // Send message on button click
      sendButton.addEventListener('click', sendMessage);

      // Send message on Enter key
      chatInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          sendMessage();
        }
      });

      // Listen for new messages from the server
      socket.on('new_message', function(data) {
        addMessageToChat(data, data.user_id === userId);
        // Scroll to bottom when new message arrives
        chatMessages.scrollTop = chatMessages.scrollHeight;
      });

      // Function to add a message to the chat UI
      function addMessageToChat(message, isCurrentUser) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isCurrentUser ? 'user' : 'other'}`;
        
        const senderSpan = document.createElement('span');
        senderSpan.className = 'sender';
        senderSpan.textContent = message.username || 'Anonymous';
        
        const messageText = document.createElement('p');
        messageText.textContent = message.message;
        
        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        const messageTime = new Date(message.timestamp || new Date());
        timeSpan.textContent = messageTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        messageDiv.appendChild(senderSpan);
        messageDiv.appendChild(messageText);
        messageDiv.appendChild(timeSpan);
        
        // Insert before welcome message
        const welcomeMessage = document.querySelector('.welcome-message');
        chatMessages.insertBefore(messageDiv, welcomeMessage);
      }

      // Handle socket errors
      socket.on('error', function(error) {
        console.error('Socket error:', error);
      });

      // Handle connection issues
      socket.on('connect_error', function(err) {
        console.error('Connection error:', err);
        // You might want to show a user-friendly message here
      });
    });
  </script>
</body>
</html>
