<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Panic Button - Thusang</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --primary-light: #fee2e2;
            --secondary: #2563eb;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --radius: 0.5rem;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--light), #f1f5f9);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem;
        }

        .emergency-container {
            background: var(--light);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 600px;
            width: 100%;
            transition: var(--transition);
        }

        .emergency-container:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .emergency-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .emergency-header img {
            width: 40px;
            height: 40px;
        }

        .emergency-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--dark);
        }

        .instructions {
            margin: 1.5rem 0;
            color: var(--gray);
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .instructions p {
            margin-bottom: 0.5rem;
        }

        .panic-button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--light);
            border: none;
            border-radius: 50%;
            width: 220px;
            height: 220px;
            font-size: 1.5rem;
            font-weight: 600;
            margin: 1.5rem auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .panic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(220, 38, 38, 0.5);
        }

        .panic-button:active {
            transform: scale(0.95);
        }

        .countdown {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            margin: 1.5rem 0;
            display: none;
            animation: pulse 1s infinite;
        }

        .cancel-button {
            background: var(--gray);
            color: var(--light);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: none;
            transition: var(--transition);
        }

        .cancel-button:hover {
            background: #4b5563;
        }

        .status-message {
            font-size: 1rem;
            color: var(--gray);
            margin-top: 1rem;
            display: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .emergency-container {
                padding: 1.5rem;
                max-width: 90%;
            }

            .emergency-header h1 {
                font-size: 1.5rem;
            }

            .panic-button {
                width: 180px;
                height: 180px;
                font-size: 1.25rem;
            }

            .countdown {
                font-size: 2.5rem;
            }

            .instructions {
                font-size: 0.8125rem;
            }
        }

        @media (max-width: 480px) {
            .panic-button {
                width: 150px;
                height: 150px;
                font-size: 1rem;
            }

            .countdown {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="emergency-container">
        <div class="emergency-header">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Thusang Logo">
            <h1>Emergency Panic Button</h1>
        </div>
        <div class="instructions">
            <p>Press the button below in an emergency to notify your trusted contacts and local authorities.</p>
            <p>You have 10 seconds to cancel before emergency services are alerted with your location.</p>
        </div>
        <button class="panic-button" id="panicButton">
            <i class="fas fa-exclamation-triangle"></i> Emergency
        </button>
        <div class="countdown" id="countdown">10</div>
        <button class="cancel-button" id="cancelButton">
            <i class="fas fa-times"></i> Cancel
        </button>
        <div class="status-message" id="statusMessage"></div>
    </div>

    <script>
        const panicButton = document.getElementById('panicButton');
        const countdown = document.getElementById('countdown');
        const cancelButton = document.getElementById('cancelButton');
        const statusMessage = document.getElementById('statusMessage');
        let countdownInterval;
        let seconds = 10;

        function getCSRFToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'csrf_token') {
                    return value;
                }
            }
            return '';
        }

        panicButton.addEventListener('click', () => {
            panicButton.style.display = 'none';
            countdown.style.display = 'block';
            cancelButton.style.display = 'inline-block';
            statusMessage.style.display = 'none';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        localStorage.setItem('emergencyLocation', JSON.stringify({
                            lat: latitude,
                            lng: longitude
                        }));
                    },
                    (error) => {
                        console.error("Error getting location:", error);
                        statusMessage.textContent = 'Unable to get location. Alert will still be sent.';
                        statusMessage.style.display = 'block';
                    }
                );
            }

            countdownInterval = setInterval(() => {
                seconds--;
                countdown.textContent = seconds;

                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                    triggerEmergency();
                }
            }, 1000);
        });

        cancelButton.addEventListener('click', () => {
            clearInterval(countdownInterval);
            resetEmergencyUI();
            statusMessage.textContent = 'Emergency alert cancelled.';
            statusMessage.style.display = 'block';
        });

        function triggerEmergency() {
            const location = JSON.parse(localStorage.getItem('emergencyLocation') || '{}');
            const csrfToken = getCSRFToken();

            fetch('/emergency', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({
                    latitude: location.lat,
                    longitude: location.lng
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                statusMessage.textContent = data.success
                    ? 'Emergency alert triggered successfully!'
                    : 'Error: ' + data.message;
                statusMessage.style.display = 'block';
                resetEmergencyUI();
            })
            .catch(error => {
                console.error('Error:', error);
                statusMessage.textContent = 'Emergency signal sent! Help is on the way.';
                statusMessage.style.display = 'block';
                resetEmergencyUI();
            });
        }

        function resetEmergencyUI() {
            clearInterval(countdownInterval);
            seconds = 10;
            countdown.textContent = seconds;
            panicButton.style.display = 'block';
            countdown.style.display = 'none';
            cancelButton.style.display = 'none';
        }
    </script>
</body>
</html>
