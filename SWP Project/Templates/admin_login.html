<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login - Thusang Community Safety Platform</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --primary-light: #e0e7ff;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #111827;
            --light: #ffffff;
            --gray: #6b7280;
            --gray-light: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-sm: 0.375rem;
            --radius: 0.5rem;
            --radius-lg: 0.75rem;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background-image: 
                radial-gradient(at 80% 10%, hsla(189, 100%, 56%, 0.15) 0px, transparent 50%),
                radial-gradient(at 10% 60%, hsla(355, 100%, 93%, 0.15) 0px, transparent 50%);
            animation: fadeInBackground 1s ease-out;
        }

        .login-card {
            width: 100%;
            max-width: 32rem;
            background: var(--light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid var(--gray-light);
            animation: slideUp 0.6s ease-out;
        }

        .login-card:hover {
            transform: translateY(-0.5rem);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--light);
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: "";
            position: absolute;
            top: -50%;
            right: -50%;
            width: 120%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(45deg);
        }

        .card-header h2 {
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: 0.75rem;
            position: relative;
            letter-spacing: 0.025em;
        }

        .card-header p {
            font-size: 1rem;
            opacity: 0.9;
            position: relative;
            max-width: 80%;
            margin: 0 auto;
        }

        .card-body {
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.75rem;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--dark);
            transition: var(--transition);
        }

        .form-control {
            width: 100%;
            padding: 1rem 1rem 1rem 3.5rem;
            border: 1px solid var(--gray-light);
            border-radius: var(--radius);
            font-size: 1rem;
            background-color: var(--light);
            color: var(--dark);
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .form-icon {
            position: absolute;
            left: 1.25rem;
            top: 2.75rem;
            color: var(--gray);
            font-size: 1.25rem;
            transition: var(--transition);
        }

        .form-control:focus + .form-icon {
            color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: var(--light);
            font-weight: 600;
            font-size: 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--primary-dark), #312e81);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .auth-links {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
            font-size: 0.875rem;
        }

        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            transition: var(--transition);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
        }

        .auth-link:hover {
            color: var(--primary-dark);
            background-color: var(--primary-light);
        }

        .auth-link i {
            margin-right: 0.5rem;
            font-size: 0.875rem;
        }

        .alert {
            padding: 1rem 1.25rem;
            border-radius: var(--radius);
            margin-bottom: 1.75rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            border: 1px solid transparent;
            animation: slideIn 0.4s ease-out;
        }

        .alert i {
            margin-right: 0.75rem;
            font-size: 1.25rem;
        }

        .alert-success {
            background-color: #ecfdf5;
            color: #065f46;
            border-color: #6ee7b7;
        }

        .alert-danger {
            background-color: #fef2f2;
            color: #b91c1c;
            border-color: #f87171;
        }

        .alert-warning {
            background-color: #fffbeb;
            color: #b45309;
            border-color: #fcd34d;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        .logo-container img {
            width: 100px;
            height: 100px;
            transition: var(--transition);
        }

        .logo-container img:hover {
            transform: scale(1.05);
        }

        @keyframes fadeInBackground {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 480px) {
            .login-card {
                max-width: 95%;
            }
            .card-header {
                padding: 2rem 1.5rem;
            }
            .card-body {
                padding: 2rem 1.5rem;
            }
            .card-header h2 {
                font-size: 1.75rem;
            }
            .card-header p {
                font-size: 0.875rem;
            }
            .logo-container img {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
    </div>

    <div class="login-card">
        <div class="card-header">
            <h2>Admin Portal</h2>
            <p>Secure access to the admin dashboard</p>
        </div>
        <div class="card-body">
            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <i class="fas fa-{% if category == 'success' %}check-circle{% elif category == 'danger' %}exclamation-circle{% else %}exclamation-triangle{% endif %}"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/admin_login" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="email" class="form-label">Admin Email</label>
                    <i class="fas fa-envelope form-icon"></i>
                    <input type="email" id="email" name="email" class="form-control" placeholder="admin@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <i class="fas fa-lock form-icon"></i>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="auth-links">
                <a href="/login" class="auth-link">
                    <i class="fas fa-user"></i> User Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
