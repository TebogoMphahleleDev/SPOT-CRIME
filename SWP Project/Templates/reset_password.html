<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Thusang Community Safety Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4a90e2, #1453a3);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* Container Styles */
        .container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .container h2 {
            margin-bottom: 30px;
            color: #1453a3;
            font-size: 28px;
            font-weight: 600;
        }

        .logo {
            width: 80px;
            margin-bottom: 20px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .input-icon input {
            padding-left: 45px;
        }

        /* Button Styles */
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #4a90e2, #1453a3);
            border: none;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: linear-gradient(to right, #3d7bc8, #0d4685);
            box-shadow: 0 5px 15px rgba(20, 83, 163, 0.3);
        }

        /* Link Styles */
        .links {
            margin-top: 25px;
            font-size: 15px;
        }

        .links a {
            color: #4a90e2;
            text-decoration: none;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #1453a3;
            text-decoration: underline;
        }

        /* Flash Message Styles */
        .flash {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 15px;
            text-align: center;
            display: none; /* Hidden by default */
        }

        .flash.success {
            background: #e6f7ee;
            color: #0a5c36;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .flash.danger {
            background: #fde8e8;
            color: #9b1c1c;
            border: 1px solid #f5c6cb;
            display: block;
        }

        /* Hidden CSRF token */
        .hidden-csrf {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Thusang Logo" class="logo">
        <h2>Reset Your Password</h2>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/reset_password" method="POST">
            <div class="hidden-csrf">
                {{ csrf_token() }}
            </div>
            
            <div class="form-group input-icon">
                <label for="email">Email Address</label>
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
            </div>
            
            <button type="submit">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
        </form>

        <div class="links">
            <p><a href="/login"><i class="fas fa-arrow-left"></i> Back to Log In</a></p>
        </div>
    </div>

    

</body>
</html>
