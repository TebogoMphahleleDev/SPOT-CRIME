<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Incident - Thusang Community Safety</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #dbeafe;
            --danger: #dc2626;
            --success: #059669;
            --warning: #d97706;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --radius: 0.5rem;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .report-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--light);
            border-bottom: 1px solid var(--gray-light);
            padding: 1.25rem 1.5rem;
            border-radius: var(--radius);
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
        }

        .report-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
        }

        .back-button {
            background: var(--primary);
            border: none;
            color: var(--light);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .back-button:hover {
            background: var(--primary-dark);
        }

        .report-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--light);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .report-container:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .form-section {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--gray-light);
        }

        .form-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title i {
            color: var(--primary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .form-label.required::after {
            content: ' *';
            color: var(--danger);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-light);
            border-radius: var(--radius);
            font-size: 0.9375rem;
            transition: var(--transition);
            background: var(--light);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .file-upload {
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .file-upload-btn {
            border: 1px dashed var(--gray-light);
            border-radius: var(--radius);
            padding: 1.25rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .file-upload-btn:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .file-upload-icon {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .file-upload-text {
            font-size: 0.875rem;
            color: var(--gray);
        }

        .file-upload input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .preview-item {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            height: 100px;
            border: 1px solid var(--gray-light);
        }

        .preview-item img, .preview-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-item audio {
            width: 100%;
            margin-top: 30px;
        }

        .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--danger);
            color: var(--light);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            font-size: 0.625rem;
            transition: var(--transition);
        }

        .remove-btn:hover {
            background: #b91c1c;
        }

        .voice-recording {
            background: var(--light);
            border-radius: var(--radius);
            padding: 1rem;
            margin-top: 1rem;
            border: 1px solid var(--gray-light);
        }

        .recording-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .recording-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: var(--radius);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .start-recording {
            background: var(--danger);
            color: var(--light);
        }

        .start-recording:hover {
            background: #b91c1c;
        }

        .stop-recording {
            background: var(--gray);
            color: var(--light);
        }

        .stop-recording:hover {
            background: #4b5563;
        }

        .recording-timer {
            font-family: monospace;
            font-size: 1rem;
            color: var(--dark);
            margin-left: auto;
        }

        .recording-visualizer {
            height: 3px;
            background: var(--gray-light);
            border-radius: 2px;
            margin-top: 0.75rem;
            overflow: hidden;
        }

        .visualizer-bar {
            height: 100%;
            width: 0%;
            background: var(--danger);
            transition: width 0.1s;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.9375rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--light);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .location-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.8125rem;
            color: var(--gray);
        }

        .location-status.success {
            color: var(--success);
        }

        .location-status.error {
            color: var(--danger);
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .report-container {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .report-header h1 {
                font-size: 1.25rem;
            }

            .section-title {
                font-size: 1.125rem;
            }

            .preview-item {
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="report-header">
        <button class="back-button" onclick="window.location.href='/dashboard'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h1>Report Suspicious Activity</h1>
    </div>

    <div class="report-container">
        <form id="incident-report-form" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Incident Details Section -->
            <div class="form-section">
                <h2 class="section-title">
                    <i class="fas fa-exclamation-triangle"></i>
                    Incident Details
                </h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="incident-type" class="form-label required">Incident Type</label>
                        <select id="incident-type" name="incident-type" class="form-control" required>
                            <option value="">Select incident type</option>
                            {% for incident_type in incident_types %}
                                <option value="{{ incident_type.id }}">{{ incident_type.name }}</option>
                            {% endfor %}
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group" id="other-crime-group" style="display: none;">
                        <label for="other-crime" class="form-label required">Specify Incident</label>
                        <input type="text" id="other-crime" name="other-crime" class="form-control" placeholder="Please specify">
                    </div>
                </div>

                <div class="form-group">
                    <label for="incident-date" class="form-label">Date & Time</label>
                    <input type="datetime-local" id="incident-date" name="incident-date" class="form-control">
                </div>

                <div class="form-group">
                    <label for="location" class="form-label required">Location</label>
                    <input type="text" id="location" name="location" class="form-control" placeholder="Auto-detected from GPS" required>
                    <small class="location-status">
                        <i class="fas fa-location-dot"></i> Detecting...
                    </small>
                </div>

                <div class="form-group">
                    <label for="description" class="form-label required">Description</label>
                    <textarea id="description" name="description" class="form-control" placeholder="Provide detailed information about the incident" required></textarea>
                </div>
            </div>

            <!-- Evidence Section -->
            <div class="form-section">
                <h2 class="section-title">
                    <i class="fas fa-camera"></i>
                    Evidence
                </h2>

                <div class="form-group">
                    <label class="form-label">Upload Photos/Videos</label>
                    <div class="file-upload">
                        <label class="file-upload-btn">
                            <div class="file-upload-icon">
                                <i class="fas fa-cloud-upload-alt"></i>
                            </div>
                            <div class="file-upload-text">Click to upload or drag and drop</div>
                            <div class="file-upload-text">JPG, PNG, MP4 (max 25MB)</div>
                            <input type="file" id="media-upload" name="media-upload" accept="image/*,video/*" multiple>
                        </label>
                    </div>
                    <div class="preview-container" id="media-preview"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Voice Note</label>
                    <div class="file-upload">
                        <label class="file-upload-btn">
                            <div class="file-upload-icon">
                                <i class="fas fa-microphone"></i>
                            </div>
                            <div class="file-upload-text">Upload audio file or record below</div>
                            <div class="file-upload-text">MP3, WAV (max 10MB)</div>
                            <input type="file" id="audio-upload" name="audio-upload" accept="audio/*">
                        </label>
                    </div>
                    <div class="preview-container" id="audio-preview"></div>

                    <div class="voice-recording">
                        <div class="recording-controls">
                            <button type="button" class="recording-btn start-recording" id="start-recording">
                                <i class="fas fa-microphone"></i> Start Recording
                            </button>
                            <button type="button" class="recording-btn stop-recording" id="stop-recording" disabled>
                                <i class="fas fa-stop"></i> Stop
                            </button>
                            <div class="recording-timer" id="recording-timer">00:00</div>
                        </div>
                        <div class="recording-visualizer">
                            <div class="visualizer-bar" id="visualizer-bar"></div>
                        </div>
                        <audio controls id="audio-playback" style="display: none; width: 100%; margin-top: 1rem;"></audio>
                    </div>
                </div>
            </div>

            <!-- Additional Information Section -->
            <div class="form-section">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="contact-name" class="form-label required">Your Name</label>
                        <input type="text" id="contact-name" name="contact-name" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="contact-phone" class="form-label required">Phone Number</label>
                        <input type="tel" id="contact-phone" name="contact-phone" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="contact-email" class="form-label">Email Address</label>
                    <input type="email" id="contact-email" name="contact-email" class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label">Vehicle Involved?</label>
                    <div style="display: flex; gap: 1rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem;">
                            <input type="radio" name="vehicle-involved" value="yes"> Yes
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem;">
                            <input type="radio" name="vehicle-involved" value="no" checked> No
                        </label>
                    </div>
                </div>

                <div id="vehicle-details" style="display: none; margin-top: 1rem;">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="vehicle-make" class="form-label">Make</label>
                            <input type="text" id="vehicle-make" name="vehicle-make" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="vehicle-model" class="form-label">Model</label>
                            <input type="text" id="vehicle-model" name="vehicle-model" class="form-control">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="vehicle-color" class="form-label">Color</label>
                            <input type="text" id="vehicle-color" name="vehicle-color" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="vehicle-license" class="form-label">License Plate</label>
                            <input type="text" id="vehicle-license" name="vehicle-license" class="form-control">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="button" class="btn btn-outline" onclick="window.location.href='/dashboard'">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> Submit Report
                </button>
            </div>
        </form>
    </div>

    <script>
        // Show/hide other crime input
        const incidentType = document.getElementById('incident-type');
        const otherCrimeGroup = document.getElementById('other-crime-group');

        incidentType.addEventListener('change', function() {
            otherCrimeGroup.style.display = this.value === 'other' ? 'block' : 'none';
        });

        // Show/hide vehicle details
        const vehicleRadios = document.querySelectorAll('input[name="vehicle-involved"]');
        const vehicleDetails = document.getElementById('vehicle-details');

        vehicleRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                vehicleDetails.style.display = this.value === 'yes' ? 'block' : 'none';
            });
        });

        // Media upload preview
        const mediaUpload = document.getElementById('media-upload');
        const mediaPreview = document.getElementById('media-preview');

        mediaUpload.addEventListener('change', function() {
            mediaPreview.innerHTML = '';

            for (let file of this.files) {
                if (file.size > 25 * 1024 * 1024) {
                    alert(`${file.name} exceeds 25MB limit.`);
                    continue;
                }

                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.innerHTML = '×';
                removeBtn.addEventListener('click', () => previewItem.remove());

                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    previewItem.appendChild(img);
                    previewItem.appendChild(removeBtn);
                } else if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.src = URL.createObjectURL(file);
                    video.controls = true;
                    previewItem.appendChild(video);
                    previewItem.appendChild(removeBtn);
                }

                mediaPreview.appendChild(previewItem);
            }
        });

        // Audio upload preview
        const audioUpload = document.getElementById('audio-upload');
        const audioPreview = document.getElementById('audio-preview');

        audioUpload.addEventListener('change', function() {
            audioPreview.innerHTML = '';

            if (this.files.length > 0) {
                const file = this.files[0];
                if (file.size > 10 * 1024 * 1024) {
                    alert(`${file.name} exceeds 10MB limit.`);
                    return;
                }

                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.innerHTML = '×';
                removeBtn.addEventListener('click', () => {
                    previewItem.remove();
                    audioUpload.value = '';
                });

                const audio = document.createElement('audio');
                audio.src = URL.createObjectURL(file);
                audio.controls = true;

                previewItem.appendChild(audio);
                previewItem.appendChild(removeBtn);
                audioPreview.appendChild(previewItem);
            }
        });

        // Voice recording functionality
        const startRecordingBtn = document.getElementById('start-recording');
        const stopRecordingBtn = document.getElementById('stop-recording');
        const recordingTimer = document.getElementById('recording-timer');
        const visualizerBar = document.getElementById('visualizer-bar');
        const audioPlayback = document.getElementById('audio-playback');

        let mediaRecorder;
        let audioChunks = [];
        let recordingInterval;
        let seconds = 0;

        startRecordingBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    clearInterval(recordingInterval);
                    seconds = 0;
                    recordingTimer.textContent = '00:00';

                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    audioChunks = [];

                    if (audioBlob.size > 10 * 1024 * 1024) {
                        alert('Recording exceeds 10MB limit.');
                        return;
                    }

                    audioPlayback.src = URL.createObjectURL(audioBlob);
                    audioPlayback.style.display = 'block';

                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.name = 'recorded-audio';
                    fileInput.style.display = 'none';
                    fileInput.files = new File([audioBlob], 'recording.wav', { type: 'audio/wav' });
                    document.getElementById('incident-report-form').appendChild(fileInput);
                };

                // Visualizer simulation
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                const updateVisualizer = () => {
                    analyser.getByteFrequencyData(dataArray);
                    const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
                    visualizerBar.style.width = `${Math.min(average, 100)}%`;
                    if (mediaRecorder.state === 'recording') {
                        requestAnimationFrame(updateVisualizer);
                    }
                };

                updateVisualizer();

                mediaRecorder.start();
                startRecordingBtn.disabled = true;
                stopRecordingBtn.disabled = false;

                recordingInterval = setInterval(() => {
                    seconds++;
                    const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                    const secs = (seconds % 60).toString().padStart(2, '0');
                    recordingTimer.textContent = `${mins}:${secs}`;
                }, 1000);
            } catch (error) {
                console.error('Error accessing microphone:', error);
                alert('Could not access microphone. Please check permissions.');
            }
        });

        stopRecordingBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                startRecordingBtn.disabled = false;
                stopRecordingBtn.disabled = true;
                visualizerBar.style.width = '0%';
            }
        });

        // Get current location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const locationInput = document.getElementById('location');
                    const locationStatus = document.querySelector('.location-status');

                    locationInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                    locationStatus.textContent = 'Location detected';
                    locationStatus.classList.add('success');
                },
                (error) => {
                    console.error('Geolocation error:', error);
                    const locationStatus = document.querySelector('.location-status');
                    locationStatus.textContent = 'Could not detect location';
                    locationStatus.classList.add('error');
                }
            );
        } else {
            const locationStatus = document.querySelector('.location-status');
            locationStatus.textContent = 'Geolocation not supported';
            locationStatus.classList.add('error');
        }
    </script>
    <script>
        // Confirmation on form submit
        const form = document.getElementById('incident-report-form');
        form.addEventListener('submit', function(event) {
            const confirmed = confirm('Are you sure you want to submit the report?');
            if (!confirmed) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
