# railway.toml

[build]
  builder = "nixpacks"
  nixPkgs = ["python311"]  # Force Python 3.11
  installCommand = "pip install gevent && pip install -r requirements.txt"

[deploy]
  startCommand = "gunicorn -c gunicorn.conf.py app:app"

[env]
  # Environment variables can be listed here (optional if you use Railway UI)
  # For example:
  # MYSQLUSER = "root"
  # MYSQLPASSWORD = "your_password"
  # MYSQLHOST = "mysql.railway.internal"
  # MYSQLPORT = "3306"
  # MYSQLDATABASE = "railway"
